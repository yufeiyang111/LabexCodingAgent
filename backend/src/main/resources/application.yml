server:
  port: 8080
  servlet:
    context-path: /api

spring:
  profiles:
    default: local
  config:
    import:
      - optional:file:${user.dir}/../.env[.properties]
      - optional:file:${user.dir}/.env[.properties]
  application:
    name: labex-agent-backend
  # 项目使用 JWT 鉴权，不需要 Spring Security 默认的内存用户（避免每次启动生成随机密码的噪音）
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${LABEX_AGENT_DB_URL:jdbc:mysql://localhost:3306/labex_agent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${LABEX_AGENT_DB_USERNAME:root}
    password: ${LABEX_AGENT_DB_PASSWORD:}
  data:
    redis:
      url: ${LABEX_AGENT_AUTH_REDIS_URL:redis://localhost:6379}
      timeout: ${LABEX_AGENT_AUTH_REDIS_TIMEOUT:2s}
      connect-timeout: ${LABEX_AGENT_AUTH_REDIS_CONNECT_TIMEOUT:2s}
  sql:
    init:
      mode: always
      schema-locations: classpath:sql/schema.sql
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB
  task:
    scheduling:
      pool:
        size: ${LABEX_AGENT_SCHEDULER_POOL_SIZE:4}
      thread-name-prefix: labex-agent-scheduler-

mybatis-plus:
  type-aliases-package: com.labex.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

jwt:
  secret: ${LABEX_AGENT_JWT_SECRET:labex-agent-local-dev-secret-key-change-me-please-64-bytes-minimum}
  expiration: ${LABEX_AGENT_JWT_EXPIRATION:86400000}
  prefix: "Bearer "

labex-agent:
  auth:
    redis-url: ${LABEX_AGENT_AUTH_REDIS_URL:}
    login-rate-limit: ${LABEX_AGENT_AUTH_LOGIN_RATE_LIMIT:10}
    oauth-exchange-rate-limit: ${LABEX_AGENT_AUTH_OAUTH_EXCHANGE_RATE_LIMIT:10}
    register-rate-limit: ${LABEX_AGENT_AUTH_REGISTER_RATE_LIMIT:5}
    captcha-rate-limit: ${LABEX_AGENT_AUTH_CAPTCHA_RATE_LIMIT:20}
    login-failure-threshold: ${LABEX_AGENT_AUTH_LOGIN_FAILURE_THRESHOLD:3}
    register-captcha-threshold: ${LABEX_AGENT_AUTH_REGISTER_CAPTCHA_THRESHOLD:3}
    failure-window-seconds: ${LABEX_AGENT_AUTH_FAILURE_WINDOW_SECONDS:300}
    captcha-ttl-seconds: ${LABEX_AGENT_AUTH_CAPTCHA_TTL_SECONDS:120}
    captcha-length: ${LABEX_AGENT_AUTH_CAPTCHA_LENGTH:5}
    captcha-width: ${LABEX_AGENT_AUTH_CAPTCHA_WIDTH:128}
    captcha-height: ${LABEX_AGENT_AUTH_CAPTCHA_HEIGHT:44}
    captcha-noise-lines: ${LABEX_AGENT_AUTH_CAPTCHA_NOISE_LINES:7}
    captcha-noise-dots: ${LABEX_AGENT_AUTH_CAPTCHA_NOISE_DOTS:70}
    captcha-font-size: ${LABEX_AGENT_AUTH_CAPTCHA_FONT_SIZE:26}
    oauth-state-ttl-seconds: ${LABEX_AGENT_AUTH_OAUTH_STATE_TTL_SECONDS:300}
    oauth-code-ttl-seconds: ${LABEX_AGENT_AUTH_OAUTH_CODE_TTL_SECONDS:120}
    oauth-http-timeout-seconds: ${LABEX_AGENT_AUTH_OAUTH_HTTP_TIMEOUT_SECONDS:10}
    oauth-callback-base-url: ${LABEX_AGENT_AUTH_OAUTH_CALLBACK_BASE_URL:http://localhost:8080/api/auth/oauth}
    oauth-frontend-callback: ${LABEX_AGENT_AUTH_OAUTH_FRONTEND_CALLBACK:http://localhost:3000/login}
    oauth-binding-frontend-callback: ${LABEX_AGENT_AUTH_OAUTH_BINDING_FRONTEND_CALLBACK:}
    github-client-id: ${LABEX_AGENT_AUTH_GITHUB_CLIENT_ID:}
    github-client-secret: ${LABEX_AGENT_AUTH_GITHUB_CLIENT_SECRET:}
    google-client-id: ${LABEX_AGENT_AUTH_GOOGLE_CLIENT_ID:}
    google-client-secret: ${LABEX_AGENT_AUTH_GOOGLE_CLIENT_SECRET:}
    invite-code-enabled: ${LABEX_AGENT_AUTH_INVITE_CODE_ENABLED:false}
    invite-codes: ${LABEX_AGENT_AUTH_INVITE_CODES:LABEX-AGENT-2026}
  project-base-path: ${LABEX_AGENT_PROJECT_BASE_PATH:D:/LabexAgent/workspaces}
  interaction-timeout-poll-interval-ms: ${LABEX_AGENT_INTERACTION_TIMEOUT_POLL_INTERVAL_MS:30000}
  retry-poll-interval-ms: ${LABEX_AGENT_RETRY_POLL_INTERVAL_MS:1000}
  legacy-migration:
    target-removal-version: ${LABEX_AGENT_LEGACY_REMOVAL_VERSION:1.1.0}
    observation-window-days: ${LABEX_AGENT_LEGACY_OBSERVATION_WINDOW_DAYS:14}
  runtime-profile:
    default-profile: ${LABEX_AGENT_RUNTIME_PROFILE_DEFAULT:labex-native}
  history:
    max-page-events-budget: ${LABEX_AGENT_HISTORY_MAX_PAGE_EVENTS_BUDGET:1000}
    max-part-output-chars: ${LABEX_AGENT_HISTORY_MAX_PART_OUTPUT_CHARS:4000}
  tool-discovery:
    read-file-candidate-limit: ${LABEX_AGENT_READ_FILE_CANDIDATE_LIMIT:3}
  tool-output:
    read-max-chars: ${LABEX_AGENT_TOOL_OUTPUT_READ_MAX_CHARS:4000}
    model-max-lines: ${LABEX_AGENT_TOOL_OUTPUT_MODEL_MAX_LINES:2000}
    model-max-bytes: ${LABEX_AGENT_TOOL_OUTPUT_MODEL_MAX_BYTES:51200}
  model-turn:
    total-timeout-ms: ${LABEX_AGENT_MODEL_TURN_TOTAL_TIMEOUT_MS:300000}
  loop:
    hard-max-iterations: ${LABEX_AGENT_HARD_MAX_ITERATIONS:0}
    soft-max-iterations: ${LABEX_AGENT_SOFT_MAX_ITERATIONS:0}
    repeated-tool-call-threshold: ${LABEX_AGENT_REPEATED_TOOL_CALL_THRESHOLD:3}
    max-cycle-length: ${LABEX_AGENT_MAX_TOOL_CYCLE_LENGTH:3}
    max-automatic-strategy-switches: ${LABEX_AGENT_MAX_AUTOMATIC_STRATEGY_SWITCHES:1}
    max-non-progress-iterations: ${LABEX_AGENT_MAX_NON_PROGRESS_ITERATIONS:8}
    finalization-recovery-limit: ${LABEX_AGENT_FINALIZATION_RECOVERY_LIMIT:1}
  subagent:
    max-turns: ${LABEX_AGENT_SUBAGENT_MAX_TURNS:16}
    default-token-budget: ${LABEX_AGENT_SUBAGENT_TOKEN_BUDGET:65536}
    max-parallel: ${LABEX_AGENT_SUBAGENT_MAX_PARALLEL:4}
    task-timeout-ms: ${LABEX_AGENT_SUBAGENT_TASK_TIMEOUT_MS:900000}
    max-spawn-depth: ${LABEX_AGENT_SUBAGENT_MAX_SPAWN_DEPTH:3}
    run-pool-size: ${LABEX_AGENT_SUBAGENT_RUN_POOL_SIZE:12}
    digest-max-chars: ${LABEX_AGENT_SUBAGENT_DIGEST_MAX_CHARS:16000}
    tool-result-max-chars: ${LABEX_AGENT_SUBAGENT_TOOL_RESULT_MAX_CHARS:8000}
    prior-context-max-chars: ${LABEX_AGENT_SUBAGENT_PRIOR_CONTEXT_MAX_CHARS:4000}
  recovery:
    auto-repair-enabled: ${LABEX_AGENT_AUTO_REPAIR_ENABLED:true}
    max-automatic-repairs: ${LABEX_AGENT_MAX_AUTOMATIC_REPAIRS:3}
    max-repeated-command-failures: ${LABEX_AGENT_MAX_REPEATED_COMMAND_FAILURES:2}
    max-environment-failures: ${LABEX_AGENT_MAX_ENVIRONMENT_FAILURES:1}
    verification-strategy: ${LABEX_AGENT_VERIFICATION_STRATEGY:auto}
    fallback-verification-strategy: ${LABEX_AGENT_FALLBACK_VERIFICATION_STRATEGY:manual}
  instance-id: ${LABEX_AGENT_INSTANCE_ID:}
  process-host-id: ${LABEX_AGENT_PROCESS_HOST_ID:}
  acceptance:
    auto-approve-verification: ${LABEX_AGENT_ACCEPTANCE_AUTO_APPROVE_VERIFICATION:true}
  execution:
    permission-profile: ${LABEX_AGENT_PERMISSION_PROFILE:labex-standard}
    network-default-enabled: ${LABEX_AGENT_NETWORK_DEFAULT_ENABLED:true}
    allow-full-access: ${LABEX_AGENT_ALLOW_FULL_ACCESS:false}
  preview:
    enabled: ${LABEX_AGENT_PREVIEW_ENABLED:true}
    startup-timeout-ms: ${LABEX_AGENT_PREVIEW_STARTUP_TIMEOUT_MS:30000}
    poll-interval-ms: ${LABEX_AGENT_PREVIEW_POLL_INTERVAL_MS:250}
    connect-timeout-ms: ${LABEX_AGENT_PREVIEW_CONNECT_TIMEOUT_MS:1000}
    output-max-chars: ${LABEX_AGENT_PREVIEW_OUTPUT_MAX_CHARS:60000}
    failure-hint-max-chars: ${LABEX_AGENT_PREVIEW_FAILURE_HINT_MAX_CHARS:512}
    output-drain-timeout-ms: ${LABEX_AGENT_PREVIEW_OUTPUT_DRAIN_TIMEOUT_MS:1000}
    min-port: ${LABEX_AGENT_PREVIEW_MIN_PORT:1024}
    max-port: ${LABEX_AGENT_PREVIEW_MAX_PORT:65535}
    readiness-host: ${LABEX_AGENT_PREVIEW_READINESS_HOST:127.0.0.1}
    public-host: ${LABEX_AGENT_PREVIEW_PUBLIC_HOST:localhost}
  monitor:
    enabled: ${LABEX_AGENT_MONITOR_ENABLED:true}
    access-code: ${LABEX_AGENT_MONITOR_ACCESS_CODE:}
    operator-code: ${LABEX_AGENT_MONITOR_OPERATOR_CODE:}
    session-ttl-hours: ${LABEX_AGENT_MONITOR_SESSION_TTL_HOURS:24}
    auth-rate-limit: ${LABEX_AGENT_MONITOR_AUTH_RATE_LIMIT:5}
    auth-failure-window-seconds: ${LABEX_AGENT_MONITOR_AUTH_FAILURE_WINDOW_SECONDS:300}
    detail-retention-days: ${LABEX_AGENT_MONITOR_DETAIL_RETENTION_DAYS:30}
    stats-retention-days: ${LABEX_AGENT_MONITOR_STATS_RETENTION_DAYS:180}
    excluded-prefixes: ${LABEX_AGENT_MONITOR_EXCLUDED_PREFIXES:/ws/,/preview/,/error,/ops/,/auth/captcha}
    geo:
      enabled: ${LABEX_AGENT_MONITOR_GEO_ENABLED:true}
      xdb-path: ${LABEX_AGENT_MONITOR_GEO_XDB_PATH:classpath:ip2region_v4.xdb}
      cache-size: ${LABEX_AGENT_MONITOR_GEO_CACHE_SIZE:4096}
    health:
      timeout-ms: ${LABEX_AGENT_MONITOR_HEALTH_TIMEOUT_MS:3000}
      executor-pool-size: ${LABEX_AGENT_MONITOR_HEALTH_EXECUTOR_POOL_SIZE:4}
      probe-timeout-ms: ${LABEX_AGENT_MONITOR_HEALTH_PROBE_TIMEOUT_MS:5000}
    runtime:
      default-page-size: ${LABEX_AGENT_MONITOR_RUNTIME_DEFAULT_PAGE_SIZE:20}
      max-page-size: ${LABEX_AGENT_MONITOR_RUNTIME_MAX_PAGE_SIZE:200}
      event-timeline-limit: ${LABEX_AGENT_MONITOR_RUNTIME_EVENT_TIMELINE_LIMIT:50}
      event-timeline-max-limit: ${LABEX_AGENT_MONITOR_RUNTIME_EVENT_TIMELINE_MAX_LIMIT:500}
      event-payload-max-chars: ${LABEX_AGENT_MONITOR_RUNTIME_EVENT_PAYLOAD_MAX_CHARS:2000}
      summary-max-chars: ${LABEX_AGENT_MONITOR_RUNTIME_SUMMARY_MAX_CHARS:200}
      metric:
        sample-interval-ms: ${LABEX_AGENT_MONITOR_METRIC_SAMPLE_INTERVAL_MS:300000}
        retention-days: ${LABEX_AGENT_MONITOR_METRIC_RETENTION_DAYS:30}
      alert:
        evaluation-interval-ms: ${LABEX_AGENT_MONITOR_ALERT_EVALUATION_INTERVAL_MS:60000}
        notification-max-attempts: ${LABEX_AGENT_MONITOR_ALERT_NOTIFICATION_MAX_ATTEMPTS:3}
        notification-retry-delay-minutes: ${LABEX_AGENT_MONITOR_ALERT_NOTIFICATION_RETRY_DELAY_MINUTES:5}
        notification-retry-interval-ms: ${LABEX_AGENT_MONITOR_ALERT_NOTIFICATION_RETRY_INTERVAL_MS:300000}
        webhook-url: ${LABEX_AGENT_MONITOR_ALERT_WEBHOOK_URL:}
        task-retry-max-attempts: ${LABEX_AGENT_MONITOR_ALERT_TASK_RETRY_MAX_ATTEMPTS:1}
        evaluation-batch-size: ${LABEX_AGENT_MONITOR_ALERT_EVALUATION_BATCH_SIZE:200}
      audit:
        retention-days: ${LABEX_AGENT_MONITOR_AUDIT_RETENTION_DAYS:180}
        cleanup-cron: ${LABEX_AGENT_MONITOR_AUDIT_CLEANUP_CRON:0 45 3 * * *}
        cleanup-batch-size: ${LABEX_AGENT_MONITOR_AUDIT_CLEANUP_BATCH_SIZE:5000}
  execution-lease-duration-ms: ${LABEX_AGENT_EXECUTION_LEASE_DURATION_MS:30000}
  execution-heartbeat-interval-ms: ${LABEX_AGENT_EXECUTION_HEARTBEAT_INTERVAL_MS:10000}
  lease-reconciliation-interval-ms: ${LABEX_AGENT_LEASE_RECONCILIATION_INTERVAL_MS:30000}
  lease-reconciliation-batch-size: ${LABEX_AGENT_LEASE_RECONCILIATION_BATCH_SIZE:50}
  worker:
    network-default-enabled: ${LABEX_AGENT_WORKER_NETWORK_DEFAULT_ENABLED:true}
    wsl:
      distribution: ${LABEX_AGENT_WSL_DISTRIBUTION:Debian}
    docker:
      image: ${LABEX_AGENT_WORKER_DOCKER_IMAGE:labex-agent-sandbox:smoke}
      max-concurrent-containers: ${LABEX_AGENT_DOCKER_MAX_CONCURRENT_CONTAINERS:8}
      wsl-workspace-mapping: ${LABEX_AGENT_DOCKER_WSL_WORKSPACE_MAPPING:false}
      host-workspace-base-path: ${LABEX_AGENT_DOCKER_HOST_WORKSPACE_BASE_PATH:}
    resources:
      cpu-millis: ${LABEX_AGENT_WORKER_CPU_MILLIS:1000}
      memory-megabytes: ${LABEX_AGENT_WORKER_MEMORY_MB:1024}
      max-pids: ${LABEX_AGENT_WORKER_MAX_PIDS:256}
  cors:
    allowed-origins: ${LABEX_AGENT_CORS_ALLOWED_ORIGINS:}
  conversation-cache:
    enabled: ${LABEX_AGENT_CONVERSATION_CACHE_ENABLED:true}
    list-ttl: ${LABEX_AGENT_CONVERSATION_CACHE_LIST_TTL:120s}
    history-ttl: ${LABEX_AGENT_CONVERSATION_CACHE_HISTORY_TTL:60s}
    context-status-ttl: ${LABEX_AGENT_CONVERSATION_CACHE_CONTEXT_STATUS_TTL:30s}
    double-delete-delay-ms: ${LABEX_AGENT_CONVERSATION_CACHE_DOUBLE_DELETE_DELAY_MS:500}
    key-prefix: ${LABEX_AGENT_CONVERSATION_CACHE_KEY_PREFIX:labex:conversation}
  secret-store:
    master-key: ${LABEX_AGENT_SECRET_STORE_MASTER_KEY:}
  websocket:
    allowed-origins: ${LABEX_AGENT_WEBSOCKET_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  lsp:
    enabled: ${LABEX_LSP_ENABLED:true}
    start-timeout-seconds: ${LABEX_LSP_START_TIMEOUT_SECONDS:90}
    request-timeout-seconds: ${LABEX_LSP_REQUEST_TIMEOUT_SECONDS:6}
    diagnostic-timeout-millis: ${LABEX_LSP_DIAGNOSTIC_TIMEOUT_MILLIS:1500}
    failure-cooldown-seconds: ${LABEX_LSP_FAILURE_COOLDOWN_SECONDS:300}
    commands:
      java: ${LABEX_LSP_JAVA_CMD:jdtls --jvm-arg=-Xms256m}
      typescript: ${LABEX_LSP_TS_CMD:typescript-language-server --stdio}
      vue: ${LABEX_LSP_VUE_CMD:vue-language-server --stdio}
      python: ${LABEX_LSP_PY_CMD:pyright-langserver --stdio}
  attachment:
    storage-path: ${LABEX_AGENT_ATTACHMENT_PATH:${LABEX_AGENT_UPLOAD_PATH:D:/LabexAgent/uploads}/agent-input-attachments}
    max-files-per-message: ${LABEX_AGENT_ATTACHMENT_MAX_FILES_PER_MESSAGE:4}
    max-file-size-bytes: ${LABEX_AGENT_ATTACHMENT_MAX_FILE_SIZE_BYTES:20971520}
    max-total-size-bytes: ${LABEX_AGENT_ATTACHMENT_MAX_TOTAL_SIZE_BYTES:41943040}
    allowed-mime-types: ${LABEX_AGENT_ATTACHMENT_ALLOWED_MIME_TYPES:image/jpeg,image/png,image/gif,image/webp}
    pending-ttl-minutes: ${LABEX_AGENT_ATTACHMENT_PENDING_TTL_MINUTES:15}
    terminal-ttl-hours: ${LABEX_AGENT_ATTACHMENT_TERMINAL_TTL_HOURS:24}
    cleanup-interval-ms: ${LABEX_AGENT_ATTACHMENT_CLEANUP_INTERVAL_MS:900000}
    cleanup-batch-size: ${LABEX_AGENT_ATTACHMENT_CLEANUP_BATCH_SIZE:100}
    estimated-image-tokens: ${LABEX_AGENT_ATTACHMENT_ESTIMATED_IMAGE_TOKENS:8192}
  file-ops:
    export-storage-dir: ${LABEX_AGENT_EXPORT_STORAGE_DIR:${LABEX_AGENT_UPLOAD_PATH:D:/LabexAgent/uploads}/exports}
    export-cleanup-interval-ms: ${LABEX_AGENT_EXPORT_CLEANUP_INTERVAL_MS:60000}
  agent-cleanup:
    enabled: ${LABEX_AGENT_CLEANUP_ENABLED:true}
    interval-ms: ${LABEX_AGENT_CLEANUP_INTERVAL_MS:1800000}
    run-log-retention-days: ${LABEX_AGENT_CLEANUP_RUN_LOG_RETENTION_DAYS:7}
    artifact-retention-days: ${LABEX_AGENT_CLEANUP_ARTIFACT_RETENTION_DAYS:7}
    preview-log-retention-days: ${LABEX_AGENT_CLEANUP_PREVIEW_LOG_RETENTION_DAYS:3}
    tmp-max-age-hours: ${LABEX_AGENT_CLEANUP_TMP_MAX_AGE_HOURS:6}
    min-age-minutes: ${LABEX_AGENT_CLEANUP_MIN_AGE_MINUTES:30}
    max-projects-per-tick: ${LABEX_AGENT_CLEANUP_MAX_PROJECTS_PER_TICK:200}
    max-delete-entries-per-tick: ${LABEX_AGENT_CLEANUP_MAX_DELETE_ENTRIES_PER_TICK:2000}
    max-delete-bytes-per-tick: ${LABEX_AGENT_CLEANUP_MAX_DELETE_BYTES_PER_TICK:134217728}
  web-search:
    provider: ${LABEX_AGENT_WEB_SEARCH_PROVIDER:auto}
    tavily-enabled: ${LABEX_AGENT_WEB_SEARCH_TAVILY_ENABLED:true}
    tavily-api-key: ${TAVILY_API_KEY:}
    exa-enabled: ${LABEX_AGENT_WEB_SEARCH_EXA_ENABLED:true}
    parallel-enabled: ${LABEX_AGENT_WEB_SEARCH_PARALLEL_ENABLED:false}
    public-fallback-enabled: ${LABEX_AGENT_WEB_SEARCH_PUBLIC_FALLBACK_ENABLED:true}
    exa-api-key: ${EXA_API_KEY:}
    parallel-api-key: ${PARALLEL_API_KEY:}
    request-timeout-seconds: ${LABEX_AGENT_WEB_SEARCH_TIMEOUT_SECONDS:25}
    max-response-bytes: ${LABEX_AGENT_WEB_SEARCH_MAX_RESPONSE_BYTES:1048576}
  web-fetch:
    connect-timeout-seconds: ${LABEX_AGENT_WEB_FETCH_CONNECT_TIMEOUT_SECONDS:20}
    request-timeout-seconds: ${LABEX_AGENT_WEB_FETCH_REQUEST_TIMEOUT_SECONDS:60}
    max-redirects: ${LABEX_AGENT_WEB_FETCH_MAX_REDIRECTS:5}
    max-response-bytes: ${LABEX_AGENT_WEB_FETCH_MAX_RESPONSE_BYTES:1048576}
    default-max-chars: ${LABEX_AGENT_WEB_FETCH_DEFAULT_MAX_CHARS:12000}
    min-max-chars: ${LABEX_AGENT_WEB_FETCH_MIN_MAX_CHARS:1000}
    max-max-chars: ${LABEX_AGENT_WEB_FETCH_MAX_MAX_CHARS:50000}

rag:
  mini-max-api-key: ${MINIMAX_API_KEY:}
  mini-max-base-url: ${MINIMAX_BASE_URL:https://api.minimaxi.com/v1}
  mini-max-api-host: ${MINIMAX_API_HOST:https://api.minimaxi.com}
  mini-max-model: ${MINIMAX_MODEL:MiniMax-M2.7-highspeed}
  image-understanding-enabled: ${LABEX_AGENT_IMAGE_UNDERSTANDING:true}
  tavily-api-key: ${TAVILY_API_KEY:}
  upload-path: ${LABEX_AGENT_UPLOAD_PATH:D:/LabexAgent/uploads}

logging:
  level:
    com.labex: info
    org.springframework.security: warn

