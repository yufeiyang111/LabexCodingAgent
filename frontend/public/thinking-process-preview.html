<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LabexAgent 思考过程展示预览</title>
  <style>
    :root {
      --page: #f1f2f4;
      --panel: #fcf9f2;
      --surface: #fffdf8;
      --surface-muted: #f2ecdf;
      --text: #2f2b26;
      --text-secondary: #625b51;
      --text-muted: #8c8479;
      --border: #e0d8c8;
      --border-soft: #ece5d8;
      --accent: #c26143;
      --accent-soft: #fff0e9;
      --success: #18866b;
      --success-soft: #e4f5ee;
      --line: #d7cdbc;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--page); color: var(--text); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; }
    .page { width: min(760px, calc(100% - 32px)); margin: 0 auto; padding: 32px 0 48px; }
    .page-header { margin-bottom: 18px; }
    .page-header h1 { margin: 0; font-size: 22px; letter-spacing: 0; }
    .page-header p { margin: 7px 0 0; color: var(--text-muted); font-size: 13px; }
    .workspace { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 22px 20px 26px; box-shadow: 0 14px 34px rgba(68, 56, 41, .08); }
    .workspace-top { display: flex; align-items: center; gap: 9px; padding-bottom: 16px; border-bottom: 1px solid var(--border-soft); color: var(--text-secondary); font-size: 12px; }
    .workspace-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
    .message { padding-top: 18px; }
    .message-label { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; color: var(--text-muted); font-size: 11px; }
    .agent-mark { width: 24px; height: 24px; display: grid; place-items: center; border-radius: 8px; background: var(--accent-soft); color: var(--accent); }
    .thinking-list { position: relative; padding-left: 36px; }
    .thinking-list::before { content: ""; position: absolute; top: 13px; bottom: 18px; left: 11px; width: 1px; background: var(--line); }
    .thinking-item { position: relative; margin-bottom: 13px; }
    .thinking-item:last-child { margin-bottom: 0; }
    .node { position: absolute; top: 13px; left: -36px; z-index: 1; width: 23px; height: 23px; display: grid; place-items: center; border: 1px solid var(--border); border-radius: 50%; background: var(--panel); color: var(--text-muted); font-size: 10px; font-weight: 700; }
    .thinking-item.done .node { border-color: #9fd8c5; background: var(--success-soft); color: var(--success); }
    .thinking-item.active .node { border-color: var(--accent); background: var(--accent); color: #fff; box-shadow: 0 0 0 4px var(--accent-soft); }
    .thinking-card { overflow: hidden; border: 1px solid var(--border-soft); border-radius: 10px; background: rgba(255, 253, 248, .72); transition: border-color .18s ease, box-shadow .18s ease, background .18s ease; }
    .thinking-card:hover { border-color: #d8b19f; box-shadow: 0 6px 15px rgba(72, 54, 40, .06); }
    .thinking-item.active .thinking-card { border-color: #e2b8a7; background: var(--surface); box-shadow: 0 7px 18px rgba(110, 72, 52, .08); }
    .thinking-header { width: 100%; display: flex; align-items: center; gap: 9px; padding: 12px 13px; border: 0; background: transparent; color: var(--text-secondary); text-align: left; cursor: pointer; font: inherit; }
    .chevron { width: 14px; height: 14px; flex: 0 0 14px; color: var(--text-muted); transition: transform .24s ease; }
    .thinking-item.open .chevron { transform: rotate(90deg); }
    .thinking-title { min-width: 0; font-size: 12px; font-weight: 650; }
    .thinking-summary { min-width: 0; overflow: hidden; color: var(--text-muted); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
    .thinking-meta { display: flex; align-items: center; gap: 7px; margin-left: auto; flex-shrink: 0; color: var(--text-muted); font-size: 10px; }
    .status { padding: 3px 7px; border-radius: 999px; font-size: 10px; line-height: 1; }
    .status.done { color: var(--success); background: var(--success-soft); }
    .status.running { color: var(--accent); background: var(--accent-soft); }
    .thinking-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .26s ease, padding .26s ease; padding: 0 13px 0 36px; color: var(--text-secondary); font-size: 13px; line-height: 1.75; }
    .thinking-item.open .thinking-body { grid-template-rows: 1fr; padding-top: 0; padding-bottom: 14px; }
    .thinking-body-inner { min-height: 0; overflow: hidden; border-left: 2px solid #ead0c5; padding-left: 12px; }
    .thinking-body p { margin: 0 0 8px; }
    .thinking-body p:last-child { margin-bottom: 0; }
    .thinking-body code { padding: 2px 5px; border-radius: 4px; background: var(--surface-muted); color: var(--accent); font-family: "SFMono-Regular", Consolas, monospace; font-size: 11px; }
    .cursor { width: 6px; height: 6px; margin-left: 2px; border-radius: 50%; background: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: .35; transform: scale(.82); } 50% { opacity: 1; transform: scale(1); } }
    .hint { margin: 18px 0 0 36px; color: var(--text-muted); font-size: 11px; }
    @media (max-width: 560px) {
      .page { width: calc(100% - 20px); padding-top: 18px; }
      .workspace { padding: 16px 13px 20px; }
      .thinking-list { padding-left: 31px; }
      .thinking-list::before { left: 10px; }
      .node { left: -31px; }
      .thinking-summary { display: none; }
      .thinking-meta { gap: 4px; }
      .thinking-body { padding-left: 28px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="page-header">
      <h1>思考过程展示优化预览</h1>
      <p>阶段节点 · 状态标签 · 可展开摘要 · 平滑展开动画</p>
    </header>
    <section class="workspace" aria-label="LabexAgent 思考过程预览">
      <div class="workspace-top"><span class="workspace-dot"></span><span>Agent 执行记录</span><span style="margin-left:auto">已保存会话</span></div>
      <div class="message">
        <div class="message-label">
          <span class="agent-mark" aria-hidden="true">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3a3 3 0 0 1 3 3v1.2a6.2 6.2 0 0 1 3.6 3.1h1.1a1.3 1.3 0 0 1 1.3 1.3v2.2a1.3 1.3 0 0 1-1.3 1.3h-1v1.5a2.2 2.2 0 0 1-2.2 2.2H7.5a2.2 2.2 0 0 1-2.2-2.2v-1.5h-1A1.3 1.3 0 0 1 3 13.8v-2.2a1.3 1.3 0 0 1 1.3-1.3h1.1A6.2 6.2 0 0 1 9 7.2V6a3 3 0 0 1 3-3Z"/><path d="M8 15h8M9 18h6"/></svg>
          </span>
          <span>LabexAgent</span><span>刚刚</span>
        </div>
        <div class="thinking-list">
          <article class="thinking-item done open">
            <span class="node">5</span>
            <div class="thinking-card">
              <button class="thinking-header" type="button" aria-expanded="true">
                <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
                <span class="thinking-title">读取已保存会话</span>
                <span class="thinking-summary">确认任务恢复点与上下文</span>
                <span class="thinking-meta"><span>0.8s</span><span class="status done">已完成</span></span>
              </button>
              <div class="thinking-body"><div class="thinking-body-inner"><p>正在从已保存的会话中恢复任务，检查最近一次有效状态。</p><p>已定位到恢复点：<code>user response</code>，可以继续执行。</p></div></div>
            </div>
          </article>
          <article class="thinking-item active open">
            <span class="node">6</span>
            <div class="thinking-card">
              <button class="thinking-header" type="button" aria-expanded="true">
                <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
                <span class="thinking-title">恢复任务响应</span>
                <span class="thinking-summary">等待用户响应进入下一步</span>
                <span class="thinking-meta"><span class="cursor" aria-label="进行中"></span><span class="status running">进行中</span></span>
              </button>
              <div class="thinking-body"><div class="thinking-body-inner"><p>正在恢复已保存任务，等待用户响应后继续。</p></div></div>
            </div>
          </article>
        </div>
        <p class="hint">点击阶段标题可展开或收起详细内容</p>
      </div>
    </section>
  </main>
  <script>
    document.querySelectorAll('.thinking-header').forEach(button => {
      button.addEventListener('click', () => {
        const item = button.closest('.thinking-item')
        const open = item.classList.toggle('open')
        button.setAttribute('aria-expanded', String(open))
      })
    })
  </script>
</body>
</html>
