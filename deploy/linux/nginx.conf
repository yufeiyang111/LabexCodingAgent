# LabexAgent 生产反向代理（T3.3）。
# 与 deploy/linux/docker-compose.yml 配合使用：frontend/dist 与证书挂载进 nginx 容器。
#
# 部署前提（必读）：
# - 交互式 WebSocket PTY 尚未恢复（见 README 支持矩阵），前端当前只使用 REST managed
#   terminal；/api/ws/ 的 Upgrade 配置保留，供 PTY 恢复后直接启用。
# - SSE（Agent 流式对话）必须关闭 proxy buffering，否则事件会攒批一次性下发。
# - client_max_body_size 必须与后端 spring.servlet.multipart 限制（100MB）一致。

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # 上传与请求体：与后端 100MB 限制一致。
    client_max_body_size 100m;

    # HTTP → HTTPS 强制跳转。
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        # 替换为实际域名；TLS 证书由部署方提供（Let's Encrypt 或受管证书）。
        server_name agent.example.com;

        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        # ---- 静态前端：/ 提供 frontend/dist，SPA 路由回退 index.html ----
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # 静态资源长缓存；index.html 不缓存，保证新版本即时生效。
        location /assets/ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # ---- API 代理：/api/ → Spring Boot（context-path /api）----
        # 变量形式延迟解析 upstream，nginx 启动时后端未就绪也不会失败。
        set $backend_upstream http://backend:8080;

        location /api/ {
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE：Agent 流式对话必须实时透传。
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            add_header X-Accel-Buffering no;
        }

        # ---- WebSocket Upgrade（PTY 恢复后启用；当前前端只用 managed terminal）----
        location /api/ws/ {
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
