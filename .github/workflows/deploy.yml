name: Tencent Cloud CI/CD Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: krccr.ccs.tencentyun.com
  IMAGE_NAME: labex-agent-backend
  DEPLOY_APP_PATH: /srv/labex-agent/app

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- 1. 后端构建 (Java 17 + Maven) ---
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build Backend Jar
        run: |
          cd backend
          mvn clean package -DskipTests

      # --- 2. 前端构建 (Node 20 + Vite) ---
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend Dist
        run: |
          cd frontend
          npm ci
          npm run build
          # 将产物打成单文件压缩包，避免多文件 SCP 耗时
          tar -czf ../frontend-dist.tar.gz -C dist .

      # --- 3. 登录腾讯云 TCR 并推送镜像 ---
      - name: Log in to Tencent Cloud TCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Build & Push Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: backend/target
          file: deploy/linux/backend.Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ secrets.TCR_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ secrets.TCR_NAMESPACE }}/${{ env.IMAGE_NAME }}:latest

      # --- 4. 上传前端产物压缩包到服务器 ---
      - name: Upload Frontend Archive
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "frontend-dist.tar.gz"
          target: "${{ env.DEPLOY_APP_PATH }}"

      # --- 5. 腾讯云服务器远程平滑发布 ---
      - name: Remote Deploy on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -e
            cd ${{ env.DEPLOY_APP_PATH }}

            echo "==> 解压更新前端静态资源..."
            mkdir -p frontend-dist
            tar -xzf frontend-dist.tar.gz -C frontend-dist
            rm -f frontend-dist.tar.gz

            echo "==> 登录腾讯云 TCR 并拉取后端最新镜像..."
            echo "${{ secrets.TCR_PASSWORD }}" | docker login ${{ env.REGISTRY }} -u "${{ secrets.TCR_USERNAME }}" --password-stdin
            docker compose --env-file .env.production pull backend

            echo "==> 平滑重启后端应用容器..."
            docker compose --env-file .env.production up -d --no-deps backend

            echo "==> 清理旧容器虚悬镜像，释放磁盘..."
            docker image prune -f

            echo "==> 部署完成！检查运行状态："
            docker compose --env-file .env.production ps
