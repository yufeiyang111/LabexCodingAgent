name: Tencent Cloud CI/CD Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: krccr.ccs.tencentyun.com
  IMAGE_NAME: labex-agent-backend
  DEPLOY_APP_PATH: /srv/labex-agent/app

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ============================================================================
      # 阶段一：发布前质量门禁（与 deploy/linux/CI_CD_DEPLOYMENT_PLAYBOOK.md 第二章一致）
      # 放在最前面：门禁不过就不进入昂贵的构建与镜像推送，避免把坏版本推到生产。
      # ============================================================================

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # 门禁 0：教程种子版本一致性。
      # 正文标记与 ON DUPLICATE KEY UPDATE 守卫版本不一致时，新教程内容会被判定为「保留」、
      # 静默不生效（历史真实故障）。这里前置拦截。
      - name: Gate - Verify Tutorial Seed Version
        run: node scripts/verify-seed-version.mjs

      # 门禁 0.5：前端未定义引用（等价 ESLint no-undef）。
      # 这类错误只在运行时抛 ReferenceError，而报错行之前的代码已经改完了状态，
      # 界面看起来正常、只有控制台在刷错误 —— 构建与单测都发现不了（历史真实故障：
      # 档位保存逻辑里 `let saved` 声明在块内、块外引用，部署后才暴露）。必须在安装依赖后、
      # 跑测试前拦截。放在 npm ci 之后是因为它需要解析源码。
      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Gate - Frontend Undefined References
        run: |
          cd frontend
          npm run check:undef

      # 门禁 0.6：新增模块文件行数上限（≤400 行）。
      # 该约束此前只写在交接文档里、没有任何执行者：脚本会吞掉目录不存在的异常
      # 并打印「检查通过：0 个文件」，等于永远绿灯（历史真实假通过）。
      - name: Gate - New Module File Line Budget
        run: node scripts/check-file-lines.mjs

      # 门禁 1：前端单元测试全量通过
      - name: Gate - Frontend Unit Tests
        run: |
          cd frontend
          npm run test

      # 门禁 2：前端生产构建（npm run build 内含 check-chunk-budget 体积预算检查）
      - name: Gate - Frontend Build & Chunk Budget
        run: |
          cd frontend
          npm run build

      # ============================================================================
      # 阶段二：产物打包
      # ============================================================================

      - name: Package Frontend Dist
        run: |
          cd frontend
          # 打成单文件压缩包再上传：避免大量小文件逐个 SCP 造成网络卡死
          tar -czf ../frontend-dist.tar.gz -C dist .

      # 收集全部增量迁移脚本（不再写死单个文件名）。
      # 新增 deploy/linux/migrations/upgrade-YYYYMMDD.sql 即会被自动纳入发布，
      # 由服务器端 apply-migrations.sh 按文件名顺序 + 台账去重执行。
      - name: Package Database Migrations
        run: |
          tar -czf migrations.tar.gz -C deploy/linux migrations
          echo "==> 本次将发布的迁移脚本："
          tar -tzf migrations.tar.gz | grep '\.sql$' || echo "（无迁移脚本）"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 门禁 3：后端高风险回归（真实执行，不是只编译测试源码）。
      # 运行状态机、审批、恢复、transcript、同步供给等发布阻断集。
      - name: Gate - Backend High-Risk Tests
        timeout-minutes: 15
        run: |
          cd backend
          mvn -s settings-local.xml -Dtest=AgentRunLifecycleServiceTest,AgentRunTranscriptServiceTest,AgentRunPartServiceTest,AgentRunRecoveryServiceTest,AgentRunInteractionDispatchClaimTest,CommandApprovalOrchestratorTest,AgentSyncFeedServiceTest test

      # 门禁 4：后端全量测试作为发布阻断。
      - name: Gate - Backend Full Test Suite
        run: |
          cd backend
          mvn -s settings-local.xml test
      # -DskipTests 只跳过执行，仍会编译测试源码，等价于 Playbook 门禁「后端编译与语法检查」
      - name: Build Backend Jar
        run: |
          cd backend
          mvn clean package -DskipTests

      # ============================================================================
      # 阶段三：镜像构建与推送
      # ============================================================================

      - name: Log in to Tencent Cloud TCR
        run: |
          if [ -z "${{ secrets.TCR_USERNAME }}" ]; then
            echo "::error::Secret [TCR_USERNAME] 为空！请检查是否添加到了 Repository secrets 下。"
            exit 1
          fi
          if [ -z "${{ secrets.TCR_PASSWORD }}" ]; then
            echo "::error::Secret [TCR_PASSWORD] 为空！请检查是否添加到了 Repository secrets 下。"
            exit 1
          fi
          if [ -z "${{ secrets.TCR_NAMESPACE }}" ]; then
            echo "::error::Secret [TCR_NAMESPACE] 为空！请检查是否添加到了 Repository secrets 下。"
            exit 1
          fi
          echo "正在登录腾讯云镜像仓库: ${{ env.REGISTRY }}..."
          echo "${{ secrets.TCR_PASSWORD }}" | docker login ${{ env.REGISTRY }} -u "${{ secrets.TCR_USERNAME }}" --password-stdin

      - name: Build & Push Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: backend/target
          file: deploy/linux/backend.Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ secrets.TCR_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ secrets.TCR_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ secrets.TCR_NAMESPACE }}/${{ env.IMAGE_NAME }}:latest

      # 统一归集到 release-artifacts/ 再上传：scp-action 用 tar 传输，
      # 目录结构可预期，配合 strip_components: 1 让文件恰好落在服务器部署目录根下。
      - name: Stage Release Artifacts
        run: |
          mkdir -p release-artifacts
          mv frontend-dist.tar.gz migrations.tar.gz release-artifacts/
          cp deploy/linux/apply-migrations.sh release-artifacts/
          cp deploy/linux/post-deploy-check.sh release-artifacts/
          cp deploy/linux/release-state.sh release-artifacts/
          chmod +x release-artifacts/apply-migrations.sh release-artifacts/post-deploy-check.sh release-artifacts/release-state.sh
          echo "==> 本次发布产物："
          ls -la release-artifacts

      # ============================================================================
      # 阶段四：上传产物到服务器
      # ============================================================================

      - name: Upload Release Artifacts
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "release-artifacts"
          target: "${{ env.DEPLOY_APP_PATH }}"
          strip_components: 1

      # ============================================================================
      # 阶段五：服务器端发布（数据变更 → 前端 → 后端 → 回收）
      # ============================================================================

      - name: Remote Deploy on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -e
            cd ${{ env.DEPLOY_APP_PATH }}

            echo "==> [1/6] 数据库增量迁移（台账去重，幂等执行）..."
            # 迁移脚本随本次发布一起上传，解压后由 apply-migrations.sh 统一处理：
            # 依据 t_schema_migration 台账跳过已应用项，按文件名顺序执行剩余项，失败即中止。
            # 生产结构变更只能通过本迁移包落地。迁移包缺失、解压失败或迁移失败，
            # 都必须阻断后续前端/后端更新，避免“代码已上线、数据库未升级”。
            if [ ! -f "migrations.tar.gz" ]; then
              echo "::error::缺少 migrations.tar.gz，停止发布：数据库结构无法确认已升级。"
              exit 1
            fi
            chmod +x apply-migrations.sh
            rm -rf migrations
            tar -xzf migrations.tar.gz
            rm -f migrations.tar.gz
            ./apply-migrations.sh migrations docker-compose.yml
            rm -f apply-migrations.sh

            echo "==> [2/6] 切换前端版本（版本目录 + 软链，保留上一版）..."
            if [ ! -f "frontend-dist.tar.gz" ]; then
              echo "::error::缺少 frontend-dist.tar.gz，前端资源未更新。"
              exit 1
            fi
            chmod +x release-state.sh
            ./release-state.sh activate-frontend frontend-dist.tar.gz "${{ github.sha }}"
            rm -f frontend-dist.tar.gz

            echo "==> [3/6] 切换后端镜像 tag 并拉取..."
            echo "${{ secrets.TCR_PASSWORD }}" | docker login ${{ env.REGISTRY }} -u "${{ secrets.TCR_USERNAME }}" --password-stdin
            # 历史缺陷：compose 读 .env.production 的 LABEX_AGENT_BACKEND_IMAGE，
            # 而流水线从不更新它，导致新镜像从未被部署。这里是唯一写入入口。
            NEW_IMAGE="${{ env.REGISTRY }}/${{ secrets.TCR_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
            ./release-state.sh set-backend-image "$NEW_IMAGE"
            docker compose --env-file .env.production pull backend

            echo "==> [4/6] 平滑重启后端容器..."
            docker compose --env-file .env.production up -d --no-deps backend


            echo "==> [5/6] 部署后应用级健康检查..."
            # 容器 Up 不代表应用可用：必须等到 Spring 启动标志 + 匿名接口 +
            # 鉴权保护 + 静态资源全部通过。失败时脚本自打印容器日志与迁移台账并 exit 1。
            chmod +x post-deploy-check.sh
            ./post-deploy-check.sh docker-compose.yml

            echo "==> [6/6] 清理虚悬镜像并核对状态..."
            docker image prune -f
            docker compose --env-file .env.production ps

            # 成功后清理辅助脚本；失败时保留以便现场排查
            rm -f apply-migrations.sh post-deploy-check.sh release-state.sh

            echo "==> 发布完成。"
